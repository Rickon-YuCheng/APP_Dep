[project]
name = "depression-backend"
version = "0.1.0"
description = "憂鬱程度自動評估系統後端"
authors = [
    { name = "Rickon", email = "a" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
